<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Ошибка ' + ${status} + ' • Monefy Dash'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cover.css}" />
    <link rel="shortcut icon" th:href="@{assets/images/favicon.ico}">
</head>
<body class="d-flex h-100 text-bg-dark">
<div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
    <header class="mb-auto">
        <h1 class="float-md-start mb-0">Monefy Dash</h1>
        <nav class="nav nav-masthead justify-content-center float-md-end">
            <a class="nav-link fw-bold py-1 px-0" href="/">Главная</a>
            <a class="nav-link fw-bold py-1 px-0" href="/start">Загрузить CSV</a>
        </nav>
    </header>
    <main class="px-3 text-center">
        <h2 th:text="${status}"></h2>
        <h3 th:text="${error}"></h3>
        <p th:text="${message}"></p>
        <a th:href="@{/}" class="btn btn-secondary">Вернуться на главную</a>
    </main>
    <footer class="mt-auto text-white-50">
        <p><a href="https://ignatt.ru/" style="color: #a3a3a3;text-decoration:none;">Евгений Игнатуша</a></p>
    </footer>
</div>
</body>
</html>
